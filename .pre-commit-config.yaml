# Pre-commit hooks for buildlog
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Black - Python code formatter
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3

  # isort - import sorter
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # flake8 - linter
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        additional_dependencies:
          - flake8-bugbear  # Additional checks for common bugs

  # mypy - type checker
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: ["--config-file", "pyproject.toml"]
        additional_dependencies:
          - types-PyYAML>=6.0.0
        pass_filenames: false
        entry: mypy src

  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-added-large-files
        args: ["--maxkb=1500"]
      - id: check-merge-conflict
      - id: debug-statements

  # Branch protection (added by buildlog init)
  - repo: local
    hooks:
      - id: no-commit-to-main
        name: prevent commits to main/master
        entry: "bash -c 'branch=$(git symbolic-ref --short HEAD 2>/dev/null); [ \"$branch\" = \"main\" ] || [ \"$branch\" = \"master\" ] && echo \"ERROR: commit to $branch blocked. Use a feature branch.\" && exit 1; exit 0'"
        language: system
        always_run: true
        pass_filenames: false

# Configuration
default_language_version:
  python: python3
