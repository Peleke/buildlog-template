# Bragi - LLM Prose Pattern Detection (named for the skald of the Aesir)
# Detect and flag synthetic-sounding prose patterns common in LLM-generated text
# These patterns aren't inherently wrong, but their overuse signals machine authorship
#
# v2: Expanded with Wikipedia "Signs of AI writing" catalog (2026-02-07)
# Source: https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing
# v3: Deep-research LLM detection synthesis (2026-03-14)
# Sources: ACL/COLING, Science Advances, PNAS, GPTZero, Ole Reissmann, et al.

persona: bragi
version: 3

rules:
  # ── Original v1 rules ──────────────────────────────────────────────

  - rule: "Em-dash overuse"
    category: prose
    context: "Anywhere: headlines, parentheticals, contrasts, asides"
    antipattern: "Any use of em dashes (—). Includes 'Not X — Y' pivots, parenthetical asides, and dramatic pauses."
    rationale: "LLMs deploy em dashes constantly and poorly. Ban them outright. Use colons, semicolons, commas, parentheses, or separate sentences instead."
    references:
      - url: "https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing#Overuse_of_em_dashes"
        title: "Wikipedia: Signs of AI writing — Em dashes"

  - rule: "Dismissive 'with' framing"
    category: prose
    context: "Feature descriptions, project summaries, demo introductions"
    antipattern: "'A demo with persistence', 'a prototype with authentication' — reducing a significant feature to a prepositional afterthought"
    rationale: "Makes complex work sound trivially assembled. Signals the author hasn't weighed the feature's actual cost."

  - rule: "Tricolon and five-item enumerations"
    category: prose
    context: "Value propositions, team descriptions, capability lists"
    antipattern: "'They execute, improvise, and forget' or 'fast, reliable, scalable, secure, and observable' — rhythmic clause lists"
    rationale: "LLMs default to tricolons and pentalogies for rhetorical rhythm. Real technical writing itemizes what matters, not what sounds balanced."
    references:
      - url: "https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing#Rule_of_three"
        title: "Wikipedia: Signs of AI writing — Rule of three"

  - rule: "Performative honesty"
    category: prose
    context: "Status updates, retrospectives, project assessments"
    antipattern: "'Being honest about where things are:', 'To be frank:', 'The truth is:' — flagging your own candor"
    rationale: "If you have to announce you're being honest, the surrounding text is performing. Just state the thing."

  - rule: "Self-referential pivot"
    category: prose
    context: "Comparative sections, differentiation arguments"
    antipattern: "'This is where X diverges from...', 'This is where things get interesting' — narrating the structure of your own argument"
    rationale: "Meta-commentary about your own text is a crutch. Make the point; don't announce you're about to make it."

  - rule: "Punchy fragment marketing copy"
    category: prose
    context: "Taglines, hero sections, feature callouts"
    antipattern: "'One knowledge base, every agent surface.' — sentence fragments styled as advertising slogans"
    rationale: "Technical docs aren't ad copy. Fragment slogans trade precision for vibes."

  - rule: "Colon-into-bold-statement"
    category: prose
    context: "Section transitions, key takeaways, framing statements"
    antipattern: "'The question it answers: **How do you...**' — colon followed by a bolded rhetorical question or declaration"
    rationale: "This is a formatting crutch that substitutes typographic emphasis for actual argumentative weight."

  - rule: "Rhythmic parallel construction closers"
    category: prose
    context: "Paragraph endings, section closers, conclusions"
    antipattern: "'decisions tied to outcomes, updated by evidence, grounded in practice' — parallel participial phrases as closers"
    rationale: "These read as sermon cadences. They sound authoritative but say little. End with a concrete claim instead."

  - rule: "Hedging with 'not' lists"
    category: prose
    context: "Definitions, scope statements, positioning"
    antipattern: "'This is not X. Not Y. Not Z.' — defining something entirely by what it isn't, in staccato negation"
    rationale: "Negative definition is evasive. Say what the thing is. Reserve negation for genuine disambiguation."

  # ── New v2 rules (from Wikipedia catalog) ───────────────────────────

  - rule: "Inflated significance framing"
    category: prose
    context: "Introductions, historical descriptions, feature announcements, any sentence describing impact"
    antipattern: "'marking a pivotal moment', 'represented a significant shift', 'setting the stage for', 'reflects broader trends', 'indelible mark', 'key turning point', 'evolving landscape' — generic grandeur that says nothing specific"
    rationale: "Replace abstract significance claims with the concrete thing that happened and why it mattered to the people involved. If you can't name a specific consequence, the significance claim is filler."
    references:
      - url: "https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing#Undue_emphasis_on_significance,_legacy,_and_broader_trends"
        title: "Wikipedia: Signs of AI writing — Inflated significance"

  - rule: "Superficial analysis via participle phrases"
    category: prose
    context: "Any sentence that appends an '-ing' clause to analyze the preceding fact"
    antipattern: "'...creating a lively community', '...further enhancing its significance', '...highlighting their historical importance', '...ensuring continued relevance', '...contributing to the broader discourse' — gerund phrases tacked onto facts as pseudo-analysis"
    rationale: "If you've stated a fact, stop. Don't append a clause that 'analyzes' it with a vague gerund. If there's a genuine implication, state it as its own sentence with specifics."
    references:
      - url: "https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing#Superficial_analyses"
        title: "Wikipedia: Signs of AI writing — Superficial analyses"

  - rule: "Promotional and puffery language"
    category: prose
    context: "Descriptions of places, organizations, products, cultural heritage, natural features"
    antipattern: "'nestled in the heart of', 'vibrant town with a rich cultural heritage', 'breathtaking region', 'natural beauty', 'renowned', 'groundbreaking', 'boasts a', 'showcasing', 'exemplifies', 'commitment to', 'profound' — travel-brochure adjectives that apply to anything"
    rationale: "Cut every adjective that doesn't help the reader distinguish this subject from any other. Replace evaluative language (vibrant, rich, breathtaking) with observable specifics (location, function, relationship to surroundings)."
    references:
      - url: "https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing#Promotional_and_advertisement-like_language"
        title: "Wikipedia: Signs of AI writing — Puffery"

  - rule: "AI vocabulary blocklist"
    category: prose
    context: "Anywhere. One is coincidence; a cluster is a bingo card."
    antipattern: "Additionally (sentence-initial), align with, crucial, delve, emphasizing, enduring, enhance, fostering, garner, highlight (as verb), interplay, intricate/intricacies, key (as adjective), landscape (abstract), pivotal, showcase, tapestry (abstract), testament, underscore (as verb), valuable, vibrant"
    rationale: "Treat these as a blocklist. Each has a more specific, less inflated replacement. 'Pivotal' means name the actual pivot. 'Tapestry' means name the threads. 'Showcase' means describe what you actually see."
    references:
      - url: "https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing#Overused_%22AI_vocabulary%22_words"
        title: "Wikipedia: Signs of AI writing — AI vocabulary"

  - rule: "Copula avoidance"
    category: prose
    context: "Descriptions, definitions, any sentence that could use 'is', 'are', 'has', 'was'"
    antipattern: "'serves as', 'stands as', 'marks', 'represents [a]', 'boasts', 'features', 'offers [a]', 'holds the distinction of being' — substituting simple copulas with inflated verbs"
    rationale: "Default to 'is', 'are', 'has', 'was'. Use 'serves as' only when something literally performs a function it wasn't designed for. Otherwise, just say what it is."
    references:
      - url: "https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing#Avoidance_of_basic_copulatives"
        title: "Wikipedia: Signs of AI writing — Copula avoidance"

  - rule: "Challenges-and-future-prospects formula"
    category: prose
    context: "Concluding sections, summaries, any passage about obstacles or outlook"
    antipattern: "'Despite its [positive words], [subject] faces challenges including...' followed by 'Despite these challenges, [vague optimism]' — the despite-challenges-despite sandwich"
    rationale: "Name the specific problems. Skip the 'despite' sandwich. Don't end with vague optimism unless you can cite a specific initiative with a timeline."
    references:
      - url: "https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing#Outline-like_conclusions_about_challenges_and_future_prospects"
        title: "Wikipedia: Signs of AI writing — Challenges formula"

  - rule: "Vague attribution and weasel words"
    category: prose
    context: "Any claim attributed to unnamed authorities or exaggerated source breadth"
    antipattern: "'Experts argue', 'Observers have noted', 'Industry reports suggest', 'has been described as', 'several publications' (when only one or two exist) — attributing claims to unnamed or inflated authorities"
    rationale: "Name the source. If the only source is the subject themselves, say so. If no one has actually said the thing, don't pretend someone has."
    references:
      - url: "https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing#Vague_attributions_and_overgeneralization_of_opinions"
        title: "Wikipedia: Signs of AI writing — Weasel words"

  - rule: "Elegant variation (synonym cycling)"
    category: prose
    context: "Any passage that refers to the same concept repeatedly"
    antipattern: "Cycling through synonyms to avoid repeating a word: 'the protagonist' then 'the key figure' then 'the eponymous character'; or 'Soviet artistic constraints' then 'non-conformist artists' then 'artistic norms' — repetition penalty made visible"
    rationale: "Repeat the same word if you mean the same thing. If you're cycling through synonyms to avoid repetition, you're probably also padding. Cut the sentence count instead."
    references:
      - url: "https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing#Elegant_variation"
        title: "Wikipedia: Signs of AI writing — Elegant variation"

  - rule: "False ranges"
    category: prose
    context: "'From X to Y' constructions listing examples"
    antipattern: "'From problem-solving and tool-making to scientific discovery, artistic expression, and technological innovation' — 'from...to' where X and Y aren't endpoints of a real scale"
    rationale: "Only use 'from X to Y' when there's an actual spectrum or progression. If they're just examples, list them."
    references:
      - url: "https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing#False_ranges"
        title: "Wikipedia: Signs of AI writing — False ranges"

  - rule: "Hedging then inflating"
    category: prose
    context: "Descriptions of minor subjects, species with unknown status, topics with limited sources"
    antipattern: "'Though it saw only limited application, it contributes to the broader history of...' or 'While specific details are limited, the general health of the ecosystem is crucial...' — acknowledging insignificance then inflating anyway"
    rationale: "If the thing is minor, say it's minor and move on. Don't hedge and then inflate. 'No assessment exists' is a complete sentence."
    references:
      - url: "https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing#Undue_emphasis_on_significance,_legacy,_and_broader_trends"
        title: "Wikipedia: Signs of AI writing — Hedging"

  - rule: "Notability assertion sections"
    category: prose
    context: "Sections about media coverage, reception, or recognition"
    antipattern: "Entire sections whose purpose is listing coverage sources to argue the subject is notable: 'featured in Wired, profiled in the New York Times, independent coverage in...' — arguing for importance rather than conveying information"
    rationale: "Summarize what sources say. Cite them as footnotes. Don't build a section whose purpose is to argue the subject deserves attention."
    references:
      - url: "https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing#Undue_emphasis_on_notability,_attribution,_and_media_coverage"
        title: "Wikipedia: Signs of AI writing — Notability assertions"

  # ── v3 rules (from deep-research LLM-detection synthesis, 2026-03-14) ──

  - rule: "Contrastive negation overuse"
    category: prose
    context: "Persuasive paragraphs, positioning statements, value propositions"
    antipattern: "'It's not X, it's Y', 'not a webapp, an MCP server', 'not your instructions, but what you approve' — the RLHF-favorite pivot structure used more than once per page"
    rationale: "Antithesis is a legitimate device. Once. When every other paragraph deploys 'not X, Y' it stops being rhetoric and becomes a tic. One per page max. If you need to contrast, restructure: state what the thing is, let the reader infer what it isn't."
    references:
      - url: "https://olereissmann.com/contrastive-negation-used-to-be-a-rhetorical-device-now-it-screams-i-used-chatgpt/"
        title: "Ole Reissmann: Contrastive negation screams ChatGPT"

  - rule: "Epistemic flatness"
    category: prose
    context: "Any multi-paragraph piece mixing established facts with speculation or opinion"
    antipattern: "Every claim at the same confidence level. No difference between 'this is how TCP works' and 'we think this might improve convergence'. Uniform authority across certainties and uncertainties."
    rationale: "Human experts modulate confidence constantly. 'I know X. Y seems likely. Z is pure speculation.' The variation in conviction is itself information. If every sentence reads at the same confidence, the text has no epistemic texture and reads as generated."
    references:
      - url: "https://gist.github.com/lmmx/d91de290ea4e6d9631e32c2dd43da413"
        title: "AI Tells Rubric — epistemic flatness as fundamental category"

  - rule: "Throat-clearing fillers"
    category: prose
    context: "Sentence openers, paragraph transitions, any preamble before the actual point"
    antipattern: "'It's worth noting that', 'It's important to understand that', 'In today's fast-paced world', 'At its core', 'Here's the thing', 'The key takeaway is', 'When it comes to', 'Let that sink in', 'In the ever-evolving landscape of'"
    rationale: "These phrases contain zero information. They are runway before takeoff. Delete them and start with the actual point. If the sentence still works without the opener, the opener was filler."
    references:
      - url: "https://www.hanalarockwriting.com/post/10-common-chatgpt-isms-what-to-watch-out-for-when-writing-content-with-ai-infographics"
        title: "Hana LaRock: 10 Common ChatGPT-isms"

  - rule: "Sentence length uniformity (low burstiness)"
    category: prose
    context: "Any passage longer than three paragraphs"
    antipattern: "Every sentence between 15-25 words. No fragments. No long, winding explorations. Metronomic regularity that the reader's subconscious registers as 'wrong' even when they can't say why."
    rationale: "Human thought is uneven. Short bursts of certainty. Long winding qualifications. Fragments for punch. If a passage has no sentence under 8 words and none over 30, it lacks burstiness and reads as machine-generated."
    references:
      - url: "https://gptzero.me/news/perplexity-and-burstiness-what-is-it/"
        title: "GPTZero: Perplexity and Burstiness"
      - url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC11874169/"
        title: "PNAS 2025: Do LLMs Write Like Humans?"

  - rule: "Performative self-answered questions"
    category: prose
    context: "Paragraph transitions, section openers, persuasive passages"
    antipattern: "'The result? More people are...', 'So what does this mean? It means...', 'Why does this matter? Because...', 'The question is: can we? The answer is yes.' — asking and immediately answering your own question as a transition device"
    rationale: "This is a copywriting bucket brigade technique that LLMs deploy mechanically as a paragraph connector. Humans pose questions when genuinely exploring uncertainty. If the answer immediately follows, the question was decorative."

  - rule: "Nominalization (verb-to-noun inflation)"
    category: prose
    context: "Any sentence using abstract noun forms of common verbs"
    antipattern: "'the implementation of' instead of 'implementing', 'the utilization of' instead of 'using', 'the development of' instead of 'developing', 'the establishment of' instead of 'establishing'"
    rationale: "LLMs nominalize at 1.5-2x the human rate. It inflates sentence length, buries the actor, and makes prose feel bureaucratic. Use the verb. 'We implemented X' not 'the implementation of X was undertaken.'"
    references:
      - url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC11422446/"
        title: "Contrasting Linguistic Patterns in Human and LLM-Generated Text"

  - rule: "Both-sides hedging (false balance)"
    category: prose
    context: "Opinion pieces, technical decisions, any passage where one position is clearly stronger"
    antipattern: "'While X has merit, it's also true that Y', 'On one hand... on the other hand...', 'There are valid arguments on both sides' — reflexively presenting counterpoints to every claim, even when evidence overwhelmingly supports one position"
    rationale: "RLHF trains models to be safe and inoffensive. The result is text that manages to sound enthusiastic and devoid of opinion simultaneously. Take a position. Dismiss bad arguments. Commit to claims. The willingness to be wrong is a marker of human authorship."
    references:
      - url: "https://arxiv.org/html/2411.15287v1"
        title: "Sycophancy in Large Language Models"
