site_name: buildlog
site_url: https://peleke.github.io/buildlog-template/
site_description: Engineering insights that compound
repo_url: https://github.com/Peleke/buildlog-template
repo_name: Peleke/buildlog-template

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
    - Core Concepts: getting-started/concepts.md
  - Guides:
    - CLI Reference: guides/cli-reference.md
    - MCP Integration: guides/mcp-integration.md
    - Storage Architecture: guides/storage-architecture.md
    - Experiments: guides/experiments.md
    - Review Gauntlet: guides/review-gauntlet.md
    - Multi-Agent Setup: guides/multi-agent.md
  - Development:
    - Contributing: development/contributing.md
  - Philosophy: philosophy.md
