site_name: buildlog
site_url: https://peleke.github.io/buildlog-template/
site_description: Engineering insights that compound
repo_url: https://github.com/Peleke/buildlog-template
repo_name: Peleke/buildlog-template

theme:
  name: readthedocs

hooks:
  - hooks/generate_llms_full.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - Learning Loop E2E: LEARNING-LOOP-E2E.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
    - Core Concepts: getting-started/concepts.md
  - Theory:
    - Overview: theory/index.md
    - The Restaurant Problem: theory/intuition.md
    - The Price of Learning: theory/regret.md
    - Keeping Score: theory/beta-distributions.md
    - Making Decisions: theory/thompson-sampling.md
    - Context Changes Everything: theory/contextual-bandits.md
  - Guides:
    - CLI Reference: guides/cli-reference.md
    - MCP Integration: guides/mcp-integration.md
    - Storage Architecture: guides/storage-architecture.md
    - Interop & Seed Ingestion: guides/interop.md
    - qortex Integration: guides/qortex-integration.md
    - Experiments: guides/experiments.md
    - Review Gauntlet: guides/review-gauntlet.md
    - Multi-Agent Setup: guides/multi-agent.md
  - Development:
    - Contributing: development/contributing.md
  - Roadmap: roadmap.md
  - Philosophy: philosophy.md
